services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ss_bot
      POSTGRES_USER: ss_bot
      POSTGRES_PASSWORD: ss_bot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ss_bot -d ss_bot"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ss_bot
      MINIO_ROOT_PASSWORD: change-me-in-production
    volumes: [minio_data:/data]
  api:
    build: .
    env_file: ${ENV_FILE:-.env}
    command: sh -c "alembic upgrade head && uvicorn apps.api.app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
  worker:
    build: .
    env_file: ${ENV_FILE:-.env}
    command: celery -A apps.worker.app.tasks.celery_app worker --beat --loglevel=INFO
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
  bot:
    build: .
    env_file: ${ENV_FILE:-.env}
    command: python -m apps.bot.app.main
    restart: unless-stopped
    depends_on:
      api: { condition: service_started }
volumes:
  postgres_data:
  minio_data:
